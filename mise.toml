[tools]
node = "24.20.0"
"npm:tfx-cli" = "0.24.0"
"npm:vite" = "latest"

[env]
_.file = ".env"

[hooks]
postinstall = "npm ci"

[tasks.build]
description = "Build the extension bundle"
run = "vite build"

[tasks.watch]
description = "Build in watch mode for local development"
run = "vite build --watch"

[tasks.package]
description = "Build and package the extension as .vsix using tfx-cli"
depends = ["build"]
run = "tfx extension create --manifest-globs vss-extension.json"

[tasks.lint]
description = "Run linter"
run = "npm run lint"

[tasks.format]
description = "Format source files with Prettier"
run = "npm run format"

[tasks.check-format]
description = "Check source files are formatted with Prettier (no write)"
run = "npm run format:check"

[tasks.test]
description = "Run tests"
run = "npm test"

[tasks.audit]
description = "Fail when npm reports high or critical dependency vulnerabilities"
run = "npm audit --audit-level=high"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf dist *.vsix"

[tasks.publish]
description = "Build and publish the extension to the Marketplace (uses $MARKETPLACE_PAT from .env)"
depends = ["build"]
run = "tfx extension publish --manifest-globs vss-extension.json --token \"$MARKETPLACE_PAT\""
