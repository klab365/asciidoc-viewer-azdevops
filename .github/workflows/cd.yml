name: CD (Publish to Marketplace)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Install mise (pinned tools: Node, tfx-cli, vite)"
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "package.json:    $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION). Update package.json and re-tag."
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

      - name: Publish to Visual Studio Marketplace
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          mise exec -- tfx extension publish \
            --manifest-globs vss-extension.json \
            --token "$MARKETPLACE_PAT" \
            --override "{\"version\":\"${{ env.VERSION }}\"}"

      - name: Upload published .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix-${{ env.VERSION }}
          path: "*.vsix"
          retention-days: 90
