name: Release and Publish

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "asciidoc-viewer-azdevops-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
       github.event_name == 'workflow_dispatch' ||
       needs.release.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || needs.release.outputs.tag_name || github.ref_name) }}

      - name: "Install mise (pinned tools: Node, tfx-cli, vite)"
        uses: jdx/mise-action@v5

      - name: Verify tag matches package.json and vss-extension.json versions
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag_name || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) TAG_VERSION="${RELEASE_TAG#v}" ;;
            asciidoc-viewer-azdevops-v*) TAG_VERSION="${RELEASE_TAG#asciidoc-viewer-azdevops-v}" ;;
            *) echo "::error::Unsupported release tag: $RELEASE_TAG"; exit 1 ;;
          esac
          PKG_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./vss-extension.json').version")"
          echo "Tag version:            $TAG_VERSION"
          echo "package.json:           $PKG_VERSION"
          echo "vss-extension.json:     $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($RELEASE_TAG) does not match package.json version ($PKG_VERSION). Update package.json and re-tag."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ($RELEASE_TAG) does not match vss-extension.json version ($MANIFEST_VERSION). Update vss-extension.json and re-tag."
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

      - name: Package .vsix (always produced, no Marketplace interaction)
        run: |
          mise exec -- tfx extension create \
            --manifest-globs vss-extension.json \
            --override "{\"version\":\"${{ env.VERSION }}\"}" \
            --output-path "asciidoc-viewer-azdevops-${{ env.VERSION }}.vsix"

      # Uploaded before the (potentially flaky) publish step, so the .vsix is
      # always available for manual upload — see the known tfx/Marketplace
      # "create new extension" timeout issue documented in plan.md.
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: asciidoc-viewer-azdevops-${{ env.VERSION }}
          path: asciidoc-viewer-azdevops-${{ env.VERSION }}.vsix
          retention-days: 90

      - name: Publish to Visual Studio Marketplace
        id: publish
        continue-on-error: true
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          mise exec -- tfx extension publish \
            --vsix "asciidoc-viewer-azdevops-${{ env.VERSION }}.vsix" \
            --token "$MARKETPLACE_PAT"

      - name: Publish result
        run: |
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            echo "✅ Published version ${{ env.VERSION }} to the Marketplace."
          else
            echo "::warning::Automatic publish failed (known tfx/Marketplace flakiness on first-time 'create extension' calls — see plan.md). Download the 'asciidoc-viewer-azdevops-${{ env.VERSION }}' artifact from this run and upload it manually at https://marketplace.visualstudio.com/manage/publishers/klab365"
          fi
