<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AsciiDoc Viewer</title>
    <link rel="stylesheet" href="../renderer/styles/main.css" />
    <link rel="stylesheet" href="../hub/hub.css" />
  </head>
  <body>
    <div class="hub-layout">
      <div class="hub-toolbar" id="hub-toolbar">
        <label id="repo-picker">
          Repository
          <select id="repo-select"></select>
        </label>
        <label id="branch-picker">
          Branch
          <select id="branch-select"></select>
        </label>
      </div>
      <div class="hub-body">
        <nav id="file-tree" class="file-tree" aria-label="AsciiDoc files"></nav>
        <button
          id="file-tree-toggle"
          class="file-tree-toggle"
          type="button"
          aria-controls="file-tree"
          aria-expanded="true"
          title="Hide file tree"
        >
          ‹
        </button>
        <main class="hub-main">
          <div id="status" class="status">Select a repository and branch, then a file from the tree.</div>
          <div id="content" class="asciidoc-content" hidden></div>
        </main>
      </div>
    </div>
    <script type="module" src="../hub/index.ts"></script>
  </body>
</html>
